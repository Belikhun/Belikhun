# The site's own server inside its container. harbor's nginx sits in front of
# it and handles TLS, HTTP/2 and the access log.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# the page itself is always asked for again, so a deploy shows at once
	add_header Cache-Control "no-cache";

	# built files carry a hash of their content in their name
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# pictures, videos, emoji and the counters keep their names between deploys
	location ~ ^/(img|video|emoji|counters)/ {
		add_header Cache-Control "public, max-age=86400";
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
